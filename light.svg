<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1180" height="610" viewBox="0 0 1180 610">

  <defs>
    <!-- Glass background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset=".5" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>

    <radialGradient id="ambient1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambient2">
      <stop offset="0" stop-color="#888888" stop-opacity=".10"/>
      <stop offset="1" stop-color="#888888" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass surfaces -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".105"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".035"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".07"/>
    </linearGradient>

    <linearGradient id="glassHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".32"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".52" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#64748B" flood-opacity=".22"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="photoMono">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1.18" exponent="1.12" offset="0"/>
        <feFuncG type="gamma" amplitude="1.18" exponent="1.12" offset="0"/>
        <feFuncB type="gamma" amplitude="1.18" exponent="1.12" offset="0"/>
      </feComponentTransfer>
    </filter>

    <pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#fff" opacity=".055"/>
    </pattern>

    <clipPath id="portraitClip">
      <rect x="66" y="124" width="390" height="350" rx="16"/>
    </clipPath>

    <clipPath id="bannerClip">
      <rect width="1180" height="610" rx="30"/>
    </clipPath>

    <style>
      .mono { font-family: Consolas, "Courier New", monospace; fill:#0F172A; }
      .muted { font-family: Consolas, "Courier New", monospace; fill:#475569; }
      .cmd { font-family: Consolas, "Courier New", monospace; fill:#0F172A; font-weight:600; }
      .line { opacity:0; }
    </style>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- BACKDROP -->
    <rect width="1180" height="610" fill="url(#bg)"/>
    <circle cx="150" cy="120" r="270" fill="url(#ambient1)" filter="url(#blur)"/>
    <circle cx="1050" cy="510" r="310" fill="url(#ambient2)" filter="url(#blur)"/>

    <!-- subtle grid -->
    <g opacity=".035" stroke="#fff">
      <path d="M0 70H1180M0 140H1180M0 210H1180M0 280H1180M0 350H1180M0 420H1180M0 490H1180M0 560H1180"/>
      <path d="M70 0V610M140 0V610M210 0V610M280 0V610M350 0V610M420 0V610M490 0V610M560 0V610M630 0V610M700 0V610M770 0V610M840 0V610M910 0V610M980 0V610M1050 0V610M1120 0V610"/>
    </g>

    <!-- LEFT GLASS CARD -->
    <rect x="38" y="38" width="454" height="530" rx="24"
          fill="url(#glass)" stroke="#fff" stroke-opacity=".22"
          filter="url(#shadow)"/>
    <rect x="39" y="39" width="452" height="528" rx="23"
          fill="none" stroke="url(#glassHighlight)" stroke-width="1"/>

    <!-- left header -->
    <circle cx="64" cy="67" r="5" fill="#fff" opacity=".9"/>
    <circle cx="82" cy="67" r="5" fill="#94A3B8"/>
    <circle cx="100" cy="67" r="5" fill="#CBD5E1"/>
    <text x="124" y="72" class="muted" font-size="14">&gt; profile.exe</text>
    <text x="432" y="72" class="muted" font-size="12">linux</text>
    <line x1="56" y1="91" x2="474" y2="91" stroke="#fff" stroke-opacity=".13"/>

    <!-- portrait glass inset -->
    <rect x="56" y="108" width="410" height="382" rx="20"
          fill="#0F172A" fill-opacity=".34"
          stroke="#fff" stroke-opacity=".14"/>

    <rect x="66" y="124" width="390" height="350"
          fill="url(#scan)" clip-path="url(#portraitClip)"/>

    <!-- animated scanline over photo -->
    <rect x="66" y="124" width="390" height="3" fill="#fff" opacity=".20">
      <animate attributeName="y" values="124;471;124" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- photo corner brackets -->
    <g fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="2">
      <path d="M84 154V138H102M438 154V138H420M84 444V460H102M438 444V460H420"/>
    </g>

    <!-- photo label -->
    <rect x="72" y="435" width="378" height="38" rx="10"
          fill="#0F172A" fill-opacity=".62" stroke="#fff" stroke-opacity=".20"/>
    <text x="88" y="459" class="mono" font-size="13">&gt; CHAMAN_KUMAR</text>
    <text x="338" y="459" class="muted" font-size="11">[ONLINE]</text>

    <text x="70" y="515" class="cmd" font-size="12">&gt; CODER  |  BUILDER  |  PROBLEM SOLVER</text>
    <text x="70" y="540" class="muted" font-size="11">&gt; C++   JAVA   PYTHON   AI   DSA   WEB</text>

    <!-- RIGHT GLASS TERMINAL -->
    <rect x="518" y="38" width="624" height="530" rx="24"
          fill="url(#glass)" stroke="#fff" stroke-opacity=".22"
          filter="url(#shadow)"/>
    <rect x="519" y="39" width="622" height="528" rx="23"
          fill="none" stroke="url(#glassHighlight)" stroke-width="1"/>

    <circle cx="545" cy="67" r="5" fill="#fff" opacity=".9"/>
    <circle cx="562" cy="67" r="5" fill="#94A3B8"/>
    <circle cx="579" cy="67" r="5" fill="#CBD5E1"/>
    <text x="603" y="72" class="muted" font-size="13">chaman@developer:~</text>
    <text x="1088" y="72" class="muted" font-size="12">bash</text>
    <line x1="534" y1="91" x2="1126" y2="91" stroke="#fff" stroke-opacity=".13"/>

    <!-- Main terminal text, sequential -->
    <g font-size="16">
      <g class="line">
        <text x="548" y="128" class="cmd">$ whoami</text>
        <animate attributeName="opacity" begin="0.4s" dur=".25s" to="1" fill="freeze"/>
      </g>
      <g class="line">
        <text x="548" y="154" class="mono">&gt; Initializing profile...</text>
        <animate attributeName="opacity" begin="1.0s" dur=".25s" to="1" fill="freeze"/>
      </g>
      <g class="line">
        <text x="548" y="180" class="mono">&gt; Hi there! 👋</text>
        <animate attributeName="opacity" begin="1.6s" dur=".25s" to="1" fill="freeze"/>
      </g>
      <g class="line">
        <text x="548" y="206" class="mono">&gt; I'm <tspan font-weight="700">Chaman Kumar</tspan></text>
        <animate attributeName="opacity" begin="2.2s" dur=".25s" to="1" fill="freeze"/>
      </g>

      <g class="line">
        <text x="548" y="242" class="cmd">$ role</text>
        <animate attributeName="opacity" begin="2.9s" dur=".25s" to="1" fill="freeze"/>
      </g>
      <g class="line">
        <text x="548" y="268" class="mono">&gt; Software Engineer</text>
        <animate attributeName="opacity" begin="3.5s" dur=".25s" to="1" fill="freeze"/>
      </g>
      <g class="line">
        <text x="548" y="294" class="mono">&gt; Software Developer</text>
        <animate attributeName="opacity" begin="4.1s" dur=".25s" to="1" fill="freeze"/>
      </g>
      <g class="line">
        <text x="548" y="320" class="mono">&gt; Competitive Programmer</text>
        <animate attributeName="opacity" begin="4.7s" dur=".25s" to="1" fill="freeze"/>
      </g>
      <g class="line">
        <text x="548" y="346" class="mono">&gt; Agentic AI Developer</text>
        <animate attributeName="opacity" begin="5.3s" dur=".25s" to="1" fill="freeze"/>
      </g>

      <g class="line">
        <text x="548" y="382" class="cmd">$ location</text>
        <animate attributeName="opacity" begin="6.0s" dur=".25s" to="1" fill="freeze"/>
      </g>
      <g class="line">
        <text x="548" y="408" class="mono">&gt; New Delhi, India</text>
        <animate attributeName="opacity" begin="6.6s" dur=".25s" to="1" fill="freeze"/>
      </g>

      <g class="line">
        <text x="548" y="444" class="cmd">$ education</text>
        <animate attributeName="opacity" begin="7.2s" dur=".25s" to="1" fill="freeze"/>
      </g>
      <g class="line">
        <text x="548" y="470" class="mono">&gt; B.Tech CSE (AI &amp; ML)</text>
        <animate attributeName="opacity" begin="7.8s" dur=".25s" to="1" fill="freeze"/>
      </g>

      <g class="line">
        <text x="548" y="506" class="cmd">$ status</text>
        <animate attributeName="opacity" begin="8.4s" dur=".25s" to="1" fill="freeze"/>
      </g>
      <g class="line">
        <text x="548" y="532" class="mono">&gt; Learning. Building. Growing.</text>
        <animate attributeName="opacity" begin="9.0s" dur=".25s" to="1" fill="freeze"/>
      </g>
    </g>

    <!-- glass shine -->
    <rect x="520" y="40" width="620" height="527" rx="23"
          fill="url(#shine)" opacity=".22">
      <animateTransform attributeName="transform" type="translate"
        values="-720 0;720 0;-720 0" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- blinking cursor -->
    <rect x="548" y="540" width="9" height="17" fill="#fff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- outer glass highlight -->
    <rect x="14" y="14" width="1152" height="582" rx="30"
          fill="none" stroke="#fff" stroke-opacity=".10"/>

  </g>
</svg>
