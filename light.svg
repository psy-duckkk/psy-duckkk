<svg width="1180" height="610" viewBox="0 0 1180 610"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Main accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color"
                 values="#7C3AED;#22D3EE;#10B981;#7C3AED"
                 dur="8s" repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color"
                 values="#22D3EE;#10B981;#7C3AED;#22D3EE"
                 dur="8s" repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color"
                 values="#10B981;#7C3AED;#22D3EE;#10B981"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Background glow -->
    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip everything to rounded canvas -->
    <clipPath id="canvasClip">
      <rect width="1180" height="610" rx="32"/>
    </clipPath>

    <!-- Panel gradient -->
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <g clip-path="url(#canvasClip)">

    <rect width="1180" height="610" fill="#FFFFFF"/>

    <!-- Background glows -->
    <circle cx="150" cy="100" r="280" fill="url(#purpleGlow)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;60 30;0 0"
        dur="12s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1050" cy="520" r="300" fill="url(#cyanGlow)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-50 -40;0 0"
        dur="14s"
        repeatCount="indefinite"/>
    </circle>


    <!-- ================================================= -->
    <!-- OUTER BORDER -->
    <!-- ================================================= -->

    <rect x="1" y="1"
          width="1178" height="608"
          rx="32"
          fill="none"
          stroke="url(#accent)"
          stroke-opacity=".45"
          stroke-width="2">

      <animate attributeName="stroke-opacity"
               values=".25;.65;.25"
               dur="5s"
               repeatCount="indefinite"/>
    </rect>


    <!-- ================================================= -->
    <!-- LEFT SECTION -->
    <!-- ================================================= -->

    <text x="70" y="80"
          fill="#94A3B8"
          font-family="monospace"
          font-size="14"
          letter-spacing="3">
      DEVELOPER PROFILE
    </text>

    <!-- ASCII portrait frame -->

    <rect x="55" y="110"
          width="400"
          height="400"
          rx="24"
          fill="#0F172A"
          fill-opacity=".72"
          stroke="#FFFFFF"
          stroke-opacity=".08"/>


    <!-- Floating ASCII -->

    <g font-family="monospace"
       font-size="16"
       font-weight="bold"
       fill="url(#accent)"
       filter="url(#glow)">

      <text x="95" y="165">
        &lt; DEV /&gt;
      </text>

      <text x="95" y="195">       █████████</text>
      <text x="95" y="215">     █████████████</text>
      <text x="95" y="235">    ███  █████  ███</text>
      <text x="95" y="255">   ███    ███    ███</text>
      <text x="95" y="275">   ███  ███████  ███</text>
      <text x="95" y="295">    ███  █████  ███</text>
      <text x="95" y="315">     █████████████</text>
      <text x="95" y="335">       █████████</text>

      <text x="95" y="375">     C++ • JAVA</text>
      <text x="95" y="397">   PYTHON • AI</text>
      <text x="95" y="419">      FULL STACK</text>

      <!-- Floating effect -->
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -8;0 0"
        dur="5s"
        repeatCount="indefinite"/>
    </g>


    <!-- Scanline -->
    <rect x="65" y="120"
          width="380"
          height="2"
          fill="#22D3EE"
          opacity=".25">

      <animate attributeName="y"
               values="120;495;120"
               dur="4s"
               repeatCount="indefinite"/>
    </rect>


    <!-- ================================================= -->
    <!-- RIGHT TERMINAL -->
    <!-- ================================================= -->

    <rect x="490" y="55"
          width="635"
          height="500"
          rx="24"
          fill="url(#panel)"
          fill-opacity=".92"
          stroke="#FFFFFF"
          stroke-opacity=".08"/>


    <!-- Terminal header -->

    <circle cx="525" cy="90" r="7" fill="#EF4444"/>
    <circle cx="550" cy="90" r="7" fill="#F59E0B"/>
    <circle cx="575" cy="90" r="7" fill="#10B981"/>

    <text x="615" y="96"
          fill="#64748B"
          font-family="monospace"
          font-size="13">
      chaman@developer:~
    </text>


    <!-- Greeting -->

    <text x="530" y="145"
          fill="#F8FAFC"
          font-family="monospace"
          font-size="25">
      Hi 👋
    </text>

    <text x="530" y="182"
          fill="#F8FAFC"
          font-family="monospace"
          font-size="25">
      I'm
      <tspan fill="url(#accent)"
             font-weight="bold">
        Chaman Kumar
      </tspan>
    </text>


    <!-- Animated role -->

    <text x="530" y="225"
          fill="#94A3B8"
          font-family="monospace"
          font-size="17">

      <tspan fill="#06B6D4">›</tspan>

      <tspan>
        Software Engineer
        <animate attributeName="opacity"
                 values="1;1;0;0;1"
                 dur="8s"
                 repeatCount="indefinite"/>
      </tspan>

    </text>


    <!-- Profile information -->

    <g font-family="monospace" font-size="15">

      <text x="530" y="275" fill="#94A3B8">
        <tspan fill="#22D3EE">📍</tspan>
        New Delhi
      </text>

      <text x="530" y="305" fill="#94A3B8">
        <tspan fill="#22D3EE">🎓</tspan>
        B.Tech CSE (AI &amp; ML)
      </text>

      <text x="530" y="335" fill="#94A3B8">
        <tspan fill="#22D3EE">⚡</tspan>
        Building with AI &amp; Full Stack
      </text>

      <text x="530" y="365" fill="#94A3B8">
        <tspan fill="#22D3EE">🌐</tspan>
        psy-duckkk.github.io
      </text>

    </g>


    <!-- Skills -->

    <text x="530" y="410"
          fill="#F8FAFC"
          font-family="monospace"
          font-size="15"
          font-weight="bold">
      TECH STACK
    </text>

    <!-- Skill pills -->

    <g font-family="monospace"
       font-size="12"
       text-anchor="middle">

      <rect x="530" y="430"
            width="70" height="28"
            rx="14"
            fill="#7C3AED"
            fill-opacity=".18"
            stroke="#7C3AED"
            stroke-opacity=".45"/>

      <text x="565" y="449" fill="#F8FAFC">C++</text>


      <rect x="610" y="430"
            width="70" height="28"
            rx="14"
            fill="#22D3EE"
            fill-opacity=".15"
            stroke="#22D3EE"
            stroke-opacity=".45"/>

      <text x="645" y="449" fill="#F8FAFC">Java</text>


      <rect x="690" y="430"
            width="75" height="28"
            rx="14"
            fill="#10B981"
            fill-opacity=".15"
            stroke="#10B981"
            stroke-opacity=".45"/>

      <text x="727" y="449" fill="#F8FAFC">Python</text>


      <rect x="775" y="430"
            width="70" height="28"
            rx="14"
            fill="#22D3EE"
            fill-opacity=".15"
            stroke="#22D3EE"
            stroke-opacity=".45"/>

      <text x="810" y="449" fill="#F8FAFC">React</text>


      <rect x="855" y="430"
            width="78" height="28"
            rx="14"
            fill="#7C3AED"
            fill-opacity=".18"
            stroke="#7C3AED"
            stroke-opacity=".45"/>

      <text x="894" y="449" fill="#F8FAFC">Node.js</text>

    </g>


    <!-- Bottom links -->

    <g font-family="monospace"
       font-size="13"
       fill="#94A3B8">

      <text x="530" y="510">
        GitHub
      </text>

      <text x="625" y="510">
        LinkedIn
      </text>

      <text x="745" y="510">
        Portfolio
      </text>

    </g>


    <!-- Blinking terminal cursor -->

    <rect x="530" y="232"
          width="9"
          height="17"
          fill="#22D3EE">

      <animate attributeName="opacity"
               values="1;0;1"
               dur="1s"
               repeatCount="indefinite"/>
    </rect>


    <!-- Floating particles -->

    <g fill="#22D3EE">

      <circle cx="475" cy="100" r="2">
        <animate attributeName="cy"
                 values="100;80;100"
                 dur="4s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="1140" cy="180" r="2">
        <animate attributeName="cy"
                 values="180;155;180"
                 dur="5s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="470" cy="520" r="2">
        <animate attributeName="cy"
                 values="520;495;520"
                 dur="6s"
                 repeatCount="indefinite"/>
      </circle>

    </g>

  </g>

</svg>